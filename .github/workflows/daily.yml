name: Daily Brief

# OpenCool triple brief (06 / 13 / 19 Asia/Shanghai) — scheduled builds are
# pinned to LLM_MODE=off (zero tokens), asserted after every build.
#
# One-time setup:
#   1. Settings → Actions → General → Workflow permissions: Read and write
#   2. Settings → Pages → Deploy from branch → gh-pages / root
#   3. Variables (recommended):
#        REPORT_TZ=Asia/Shanghai
#        REPORT_HOUR=6,13,19
#        REPORT_LOCALE=zh
#        REPORT_LOOKBACK_DAYS=1   (gate rescans this many past days)
#        PUBLISH_LAG_LIMIT_MIN=20 (publish-lag assertion tolerance)
#      The workflow does NOT read LLM_MODE from vars/secrets: the build job
#      pins LLM_MODE=off, forwards no provider key, and fails the run if
#      logs/llm-calls.jsonl records a single call. Zero tokens is structural,
#      not a "secret happens to be unset" accident — do not add an LLM key to
#      this repo's Actions secrets expecting enrichment to light up.
#   4. Optional: secret/var ALERT_WEBHOOK_URL for missing-edition / failure /
#      publish-lag pings (scripts/notify-failure.mjs no-ops when unset).
#      Optional push: secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (Telegram)
#      or variable NTFY_TOPIC (ntfy.sh) — new editions get pushed; no-op unset.
#   5. Actions → Daily Brief → Run workflow once to seed.
#
# Live: https://<user>.github.io/<repo>/
# Archive listing norm starts 2026-09-16 (06 + 13 + 19).

on:
  # Every 15 minutes instead of twice an hour. GitHub silently drops
  # scheduled triggers under load; with only two chances an hour a drop cost
  # the whole edition (11-04, 11-09, 11-11 lost 19 entirely; several landed
  # 2-5h late). Each tick is a cheap no-op when everything is published.
  #
  # Offsets 4/19/34/49 avoid the top-of-hour crush where drops cluster the
  # most (every other repo's cron fires at :00).
  schedule:
    - cron: '4,19,34,49 * * * *'
  # Owner directive: a merge to main goes live. Publishing uses
  # peaceiris/actions-gh-pages, which pushes to the gh-pages branch — not
  # main — so `branches: [main]` cannot self-trigger this workflow. (Pushes
  # made with the default GITHUB_TOKEN don't start new workflow runs anyway,
  # but the branch filter is what actually guarantees no recursion.)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # The gate's in-flight guard reads workflow runs/jobs to avoid stacking a
  # second build (and thrashing a slow one via cancel-in-progress). Without
  # this scope that API returns 403 and the guard fails open.
  actions: read

# NOTE: no workflow-level concurrency — a hung build must never queue-block
# the cheap gate runs. The build job carries its own concurrency group below.

jobs:
  gate:
    name: Time gate
    runs-on: ubuntu-latest
    # Cheap by construction: a sparse checkout of one file, no setup-node, no
    # npm ci, no build. A tick is job startup plus a handful of Contents API
    # probes — billed as ~1 runner-minute, and this repo is public, where
    # standard GitHub-hosted runners don't consume the paid minute quota.
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      edition-hour: ${{ steps.check.outputs.edition-hour }}
      edition-date: ${{ steps.check.outputs.edition-date }}
      backfill: ${{ steps.check.outputs.backfill }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/gate.mjs
          sparse-checkout-cone-mode: false

      - name: Check schedule
        id: check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR || '6,13,19' }}
          REPORT_DAYS: ${{ vars.REPORT_DAYS }}
          # How many past days to rescan for a missing sidecar. 1 covers the
          # midnight rollover this gate exists to fix. Raise it deliberately
          # to heal a longer outage — but note a backfill re-fetches the feeds
          # now, so a slot recovered N days late files current news under an
          # older date. Each extra day costs 3 more API probes per tick.
          REPORT_LOOKBACK_DAYS: ${{ vars.REPORT_LOOKBACK_DAYS || '1' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gate.mjs


  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    # 25min hard stop pairs with the pipeline watchdog (PIPELINE_DEADLINE_MIN,
    # default 20min in scripts/daily.ts): a hung build gets cut loose well
    # before it can starve later editions.
    timeout-minutes: 25
    # Job-level group: overlapping builds queue/cancel here only — gates
    # always run. A newer dispatch cancels a hung older build; the gate's
    # in-flight guard means a slow build is not restarted on every tick, and
    # the missing slot is recovered by the next scheduled catchup.
    concurrency:
      group: daily-brief-build
      cancel-in-progress: true
    # ZERO-TOKEN GUARD (owner directive, non-negotiable): the scheduled / CI
    # pipeline must never spend a token, and that must not depend on a secret
    # being absent. The mode is pinned at JOB level and no provider key is
    # forwarded to any step, so `LLM_MODE=auto`'s "a key exists → light up
    # enrichment" path is unreachable here. lib/ai/llm.ts additionally throws
    # LlmDisabledError before dispatch in off mode, and the
    # "Assert zero LLM calls" step fails the run if any call is ever logged.
    env:
      LLM_MODE: 'off'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Scope for the zero-token assertion at the end of the job: it only
      # counts calls recorded at/after this instant, so the check means "this
      # run spent nothing", not "somebody's log happens to be empty".
      - name: Record run start
        run: echo "LLM_LOG_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Quality gate: typecheck + tests + source-config validation block the
      # publish. A regression must never reach gh-pages (fifth-wave mandate).
      # Typecheck runs first: `tsx` strips types without checking them, so
      # without this step type regressions ship to Pages silently.
      - name: Typecheck
        run: npm run typecheck

      - name: Test suite (quality gate)
        run: npm test

      - name: Validate source config
        run: npm run sources:check

      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            rm -f daily_reports/index.html daily_reports/archive.html
            echo "Restored $(ls -1d daily_reports/20*/ 2>/dev/null | wc -l) prior report dirs"
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      # A gate probe that saw 403/429/000 rebuilds a slot that may in fact be
      # live. Capture that BEFORE `npm run daily` overwrites the sidecar, so
      # the lag assertion can tell a republish (slot was met earlier) from a
      # genuinely late first publish.
      - name: Note whether this edition was already live
        run: |
          SIDE="daily_reports/${{ needs.gate.outputs.edition-date }}/${{ needs.gate.outputs.edition-hour }}.json"
          if [ -s "$SIDE" ]; then
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
            echo "already live: $SIDE (rebuild, not a first publish)"
          else
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
            echo "not yet published: $SIDE"
          fi

      - name: Bake pre-market tips
        run: npm run calendar:bake

      - name: Bake dragon-tiger list
        run: npm run lhb:bake

      - name: Generate edition report
        env:
          # Zero-token mode is pinned at job level (see `env:` on the job).
          # Re-stated here so a future edit that adds a step-level env cannot
          # silently re-enable the LLM path, and so the value is visible in the
          # step's environment listing in the run log.
          LLM_MODE: 'off'
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR || '6,13,19' }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
          # Both outputs are always set by the gate; when the gate picked a
          # past date this is the only way the pipeline can write that
          # folder at all (todayKey() honours it, and rejects anything that
          # is not a real YYYY-MM-DD / not in the future).
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          DISABLE_SOURCE_IDS: ${{ vars.DISABLE_SOURCE_IDS || 'linuxdo' }}
          DAILYHOT_API_BASE: ${{ vars.DAILYHOT_API_BASE }}
          WEB_MODE: 'true'
        run: npm run daily

      - name: Build trails page (favorites)
        run: npm run build-trails

      - name: Bake keyword heat (7d)
        run: npm run keywords:bake

      - name: Bake weekly review (7d)
        run: npm run weekly:bake

      - name: Bake theme heat
        run: npm run themes:bake

      # Guard: theme board heat silently shipped `boards=0` from 2026-11-11 to
      # 2026-11-13 while CI stayed green. Fail the run instead of publishing a
      # themes.json where no theme resolved a board.
      - name: Assert theme boards resolved
        run: |
          node -e '
            const t = require("./daily_reports/themes.json");
            const boards = t.themes.filter((x) => x.boardCode).length;
            const moved = t.themes.filter((x) => typeof x.boardChangePct === "number").length;
            const members = t.themes.filter((x) => (x.constituents ?? []).length > 0).length;
            console.log(`themes=${t.themes.length} boards=${boards} quoted=${moved} withConstituents=${members} status=${t.status} registry=${t.registry}`);
            if (boards < 15) {
              console.error(`::error::only ${boards}/${t.themes.length} themes resolved a board (need >= 15) — board resolution is broken`);
              process.exit(1);
            }
          '

      - name: Bake trend periods
        run: npm run periods:bake

      - name: Bake search index
        run: npm run search:bake

      - name: Build static site (index + archive)
        run: npm run build-site

      # ZERO-TOKEN ASSERT (owner directive): machine-checkable proof that this
      # run spent no LLM call — no human or agent has to read the log.
      # `logs/llm-calls.jsonl` absent is the expected zero-call case and
      # passes; ANY entry at/after LLM_LOG_SINCE fails the run BEFORE it can
      # publish. Deliberately after the last generating step (build-site) so a
      # bake that ever grows an LLM call is caught too.
      - name: Assert zero LLM calls
        run: node scripts/assert-zero-llm.mjs --since "$LLM_LOG_SINCE"

      - name: Alert if edition HTML missing or empty
        if: always()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || vars.ALERT_WEBHOOK_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
        run: node scripts/notify-failure.mjs --missing-html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'brief: ${{ needs.gate.outputs.edition-date }}/${{ needs.gate.outputs.edition-hour }} for ${{ github.run_id }}'

      # PUBLISH-LAG ASSERT (owner directive): "did it publish on time" is a
      # machine check, not something a human or agent watches.
      #
      # Deliberately AFTER the publish step: a late edition must still go
      # live, then turn the run red. Failing before publish would drop the
      # edition again, the gate would rebuild it even later, and the slot
      # could never recover.
      #
      # Lag = the instant this step runs (immediately after the gh-pages push,
      # so it IS the publish moment) minus the slot time in Asia/Shanghai.
      # > PUBLISH_LAG_LIMIT_MIN (default 20) fails the run and calls
      # scripts/notify-failure.mjs. A backfilled (补发) edition reports its lag
      # and stays green — it is a recovery, not a breach.
      - name: Assert publish lag
        id: publish-lag
        env:
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
          EDITION_TRIGGER: ${{ needs.gate.outputs.reason }}
          # ALREADY_PUBLISHED arrives via $GITHUB_ENV from the step above.
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          PUBLISH_LAG_LIMIT_MIN: ${{ vars.PUBLISH_LAG_LIMIT_MIN || '20' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || vars.ALERT_WEBHOOK_URL }}
        run: node scripts/assert-publish-lag.mjs

      - name: Push new edition (opt-in)
        if: success()
        env:
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: node scripts/notify-publish.mjs

      - name: Alert on job failure
        # cancelled() too: a timeout/hung build is cancelled, not failure —
        # without this branch the alert step is silently skipped.
        # PUBLISH_LAG_NOTIFIED: the lag assertion already paged with the real
        # lag numbers, so do not page twice for one late edition.
        if: (failure() || cancelled()) && env.PUBLISH_LAG_NOTIFIED != 'true'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || vars.ALERT_WEBHOOK_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
        run: node scripts/notify-failure.mjs --failure --reason "build job failed"
