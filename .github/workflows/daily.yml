name: Daily Brief

# OpenCool triple brief (06 / 13 / 19 Asia/Shanghai) — scheduled builds are
# pinned to LLM_MODE=off (zero tokens), asserted after every build.
#
# One-time setup:
#   1. Settings → Actions → General → Workflow permissions: Read and write
#   2. Settings → Pages → Deploy from branch → gh-pages / root
#   3. Variables (recommended):
#        REPORT_TZ=Asia/Shanghai
#        REPORT_HOUR=6,13,19
#        REPORT_LOCALE=zh
#        REPORT_LOOKBACK_DAYS=1   (gate rescans this many past days)
#        PUBLISH_LAG_LIMIT_MIN=20 (publish-lag assertion tolerance)
#      The workflow does NOT read LLM_MODE from vars/secrets: the build job
#      pins LLM_MODE=off, forwards no provider key, and fails the run if
#      logs/llm-calls.jsonl records a single call. Zero tokens is structural,
#      not a "secret happens to be unset" accident — do not add an LLM key to
#      this repo's Actions secrets expecting enrichment to light up.
#   4. Optional: secret/var ALERT_WEBHOOK_URL for missing-edition / failure /
#      publish-lag pings (scripts/notify-failure.mjs no-ops when unset).
#      Optional push: secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID (Telegram)
#      or variable NTFY_TOPIC (ntfy.sh) — new editions get pushed; no-op unset.
#   5. Actions → Daily Brief → Run workflow once to seed.
#
# Live: https://<user>.github.io/<repo>/
# Archive listing norm starts 2026-09-16 (06 + 13 + 19).

on:
  # Every 15 minutes instead of twice an hour. GitHub silently drops
  # scheduled triggers under load; with only two chances an hour a drop cost
  # the whole edition (11-04, 11-09, 11-11 lost 19 entirely; several landed
  # 2-5h late). Each tick is a cheap no-op when everything is published.
  #
  # Offsets 4/19/34/49 avoid the top-of-hour crush where drops cluster the
  # most (every other repo's cron fires at :00).
  schedule:
    - cron: '4,19,34,49 * * * *'
  # Owner directive: a merge to main goes live. Publishing uses
  # peaceiris/actions-gh-pages, which pushes to the gh-pages branch — not
  # main — so `branches: [main]` cannot self-trigger this workflow. (Pushes
  # made with the default GITHUB_TOKEN don't start new workflow runs anyway,
  # but the branch filter is what actually guarantees no recursion.)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Manual tape capture for one session slot (`09:35` … `15:05`), leaving
      # the edition trigger untouched. Empty is the normal case: the gate then
      # decides from the clock. This is the only way to capture outside a
      # session window, and it exists so the mechanism can be exercised without
      # waiting for 09:35.
      tape_slot:
        description: 'Force a tape capture for one slot (HH:MM or HHMM); leave empty'
        required: false
        default: ''

permissions:
  contents: write
  # The gate's in-flight guard reads workflow runs/jobs to avoid stacking a
  # second build (and thrashing a slow one via cancel-in-progress). Without
  # this scope that API returns 403 and the guard fails open.
  actions: read

# NOTE: no workflow-level concurrency — a hung build must never queue-block
# the cheap gate runs. The build job carries its own concurrency group below.

jobs:
  gate:
    name: Time gate
    runs-on: ubuntu-latest
    # Cheap by construction: a sparse checkout of one file, no setup-node, no
    # npm ci, no build. A tick is job startup plus a handful of Contents API
    # probes — billed as ~1 runner-minute, and this repo is public, where
    # standard GitHub-hosted runners don't consume the paid minute quota.
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      edition-hour: ${{ steps.check.outputs.edition-hour }}
      edition-date: ${{ steps.check.outputs.edition-date }}
      backfill: ${{ steps.check.outputs.backfill }}
      reason: ${{ steps.check.outputs.reason }}
      # Point-in-time tape decision (same script, `--mode=tape`). The edition
      # outputs above are produced by the unmodified edition call; the tape call
      # writes a disjoint set of outputs, so neither can move the other.
      tape-should-run: ${{ steps.tape.outputs.tape-should-run }}
      tape-date: ${{ steps.tape.outputs.tape-date }}
      tape-slot: ${{ steps.tape.outputs.tape-slot }}
      tape-reason: ${{ steps.tape.outputs.tape-reason }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/gate.mjs
          sparse-checkout-cone-mode: false

      - name: Check schedule
        id: check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR || '6,13,19' }}
          REPORT_DAYS: ${{ vars.REPORT_DAYS }}
          # How many past days to rescan for a missing sidecar. 1 covers the
          # midnight rollover this gate exists to fix. Raise it deliberately
          # to heal a longer outage — but note a backfill re-fetches the feeds
          # now, so a slot recovered N days late files current news under an
          # older date. Each extra day costs 3 more API probes per tick.
          REPORT_LOOKBACK_DAYS: ${{ vars.REPORT_LOOKBACK_DAYS || '1' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gate.mjs

      # Tape capture decision — same script, `--mode=tape`, same sparse checkout
      # so this step needs no `npm ci` and no setup-node. Runs after the edition
      # decision on purpose: it must never be able to change that step's
      # outputs, and a failure here must not fail the gate job (fail-open: a
      # missing tape tick is a named gap in the tape index, not a lost edition).
      - name: Check tape schedule
        id: tape
        continue-on-error: true
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          # How far past a slot's nominal time a capture is still filed under
          # that slot. 20min absorbs a dropped scheduled trigger; beyond it the
          # slot stays a gap rather than being written late under a timestamp it
          # does not describe. 0 = exact-minute capture only.
          TAPE_GRACE_MIN: ${{ vars.TAPE_GRACE_MIN || '20' }}
          # Empty in every normal run. Set to a slot (e.g. 1405) via
          # workflow_dispatch to force one capture.
          TAPE_SLOT: ${{ github.event.inputs.tape_slot }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gate.mjs --mode=tape


  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    # 25min hard stop pairs with the pipeline watchdog (PIPELINE_DEADLINE_MIN,
    # default 20min in scripts/daily.ts): a hung build gets cut loose well
    # before it can starve later editions.
    timeout-minutes: 25
    # Job-level group: overlapping builds queue/cancel here only — gates
    # always run. A newer dispatch cancels a hung older build; the gate's
    # in-flight guard means a slow build is not restarted on every tick, and
    # the missing slot is recovered by the next scheduled catchup.
    concurrency:
      group: daily-brief-build
      cancel-in-progress: true
    # ZERO-TOKEN GUARD (owner directive, non-negotiable): the scheduled / CI
    # pipeline must never spend a token, and that must not depend on a secret
    # being absent. The mode is pinned at JOB level and no provider key is
    # forwarded to any step, so `LLM_MODE=auto`'s "a key exists → light up
    # enrichment" path is unreachable here. lib/ai/llm.ts additionally throws
    # LlmDisabledError before dispatch in off mode, and the
    # "Assert zero LLM calls" step fails the run if any call is ever logged.
    env:
      LLM_MODE: 'off'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Scope for the zero-token assertion at the end of the job: it only
      # counts calls recorded at/after this instant, so the check means "this
      # run spent nothing", not "somebody's log happens to be empty".
      - name: Record run start
        run: echo "LLM_LOG_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Quality gate: typecheck + tests + source-config validation block the
      # publish. A regression must never reach gh-pages (fifth-wave mandate).
      # Typecheck runs first: `tsx` strips types without checking them, so
      # without this step type regressions ship to Pages silently.
      - name: Typecheck
        run: npm run typecheck

      - name: Test suite (quality gate)
        run: npm test

      - name: Validate source config
        run: npm run sources:check

      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            rm -f daily_reports/index.html daily_reports/archive.html
            echo "Restored $(ls -1d daily_reports/20*/ 2>/dev/null | wc -l) prior report dirs"
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      # A gate probe that saw 403/429/000 rebuilds a slot that may in fact be
      # live. Capture that BEFORE `npm run daily` overwrites the sidecar, so
      # the lag assertion can tell a republish (slot was met earlier) from a
      # genuinely late first publish.
      - name: Note whether this edition was already live
        run: |
          SIDE="daily_reports/${{ needs.gate.outputs.edition-date }}/${{ needs.gate.outputs.edition-hour }}.json"
          if [ -s "$SIDE" ]; then
            echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
            echo "already live: $SIDE (rebuild, not a first publish)"
          else
            echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
            echo "not yet published: $SIDE"
          fi

      - name: Bake pre-market tips
        run: npm run calendar:bake

      - name: Bake dragon-tiger list
        run: npm run lhb:bake

      - name: Generate edition report
        env:
          # Zero-token mode is pinned at job level (see `env:` on the job).
          # Re-stated here so a future edit that adds a step-level env cannot
          # silently re-enable the LLM path, and so the value is visible in the
          # step's environment listing in the run log.
          LLM_MODE: 'off'
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR || '6,13,19' }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
          # Both outputs are always set by the gate; when the gate picked a
          # past date this is the only way the pipeline can write that
          # folder at all (todayKey() honours it, and rejects anything that
          # is not a real YYYY-MM-DD / not in the future).
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          DISABLE_SOURCE_IDS: ${{ vars.DISABLE_SOURCE_IDS || 'linuxdo' }}
          DAILYHOT_API_BASE: ${{ vars.DAILYHOT_API_BASE }}
          WEB_MODE: 'true'
        run: npm run daily

      - name: Build trails page (favorites)
        run: npm run build-trails

      - name: Bake keyword heat (7d)
        run: npm run keywords:bake

      - name: Bake weekly review (7d)
        run: npm run weekly:bake

      - name: Bake theme heat
        run: npm run themes:bake

      # Story ledger: folds this edition into daily_reports/stories.json, which
      # the gh-pages restore above brought in and the publish step below sends
      # back. That round trip IS the persistence — no new store, no database.
      # Fail-open: a corrupt ledger falls back to replaying the retained
      # sidecars, and the script exits 0 even if that fails.
      #
      # REPORT_TZ is load-bearing here, not cosmetic: `firstSeenAt` is written
      # as an ISO instant carrying the report timezone's offset, and this step
      # has no job-level REPORT_TZ. Without it the very first published ledger
      # shipped `timezone: "system"` and every `firstSeenAt` at `+00:00` — a
      # point-in-time record stamped in the runner's clock. The assert below
      # exists because that regression was invisible: the run stayed green.
      - name: Bake story ledger
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
        run: npm run stories:bake

      # Guard: a ledger whose instants are not in the report timezone cannot
      # support the point-in-time claim (increments 4/5/7 read these). Fail the
      # run rather than publish it — the same lesson as the theme-board assert.
      - name: Assert story ledger timezone
        run: |
          node -e '
            const s = require("./daily_reports/stories.json");
            const expected = process.env.REPORT_TZ || "Asia/Shanghai";
            const sample = s.stories.slice(0, 50).map((x) => x.firstSeenAt);
            const off = sample.map((iso) => (String(iso).match(/([+-]\d{2}:\d{2}|Z)$/) || [])[0]);
            const bad = off.filter((o) => !o || o === "Z" || o === "+00:00");
            const lead = s.firstMover && s.firstMover.leadBasis;
            console.log(`[stories] timezone=${s.timezone} stories=${s.stories.length} offsets=${[...new Set(off)].join("/")} leadBasis=${lead}`);
            if (s.timezone !== expected) {
              console.error(`::error::stories.json timezone is "${s.timezone}", expected "${expected}" — REPORT_TZ missing from the bake step`);
              process.exit(1);
            }
            if (bad.length) {
              console.error(`::error::${bad.length}/${sample.length} firstSeenAt values are not offset-stamped (${[...new Set(bad)].join("/")})`);
              process.exit(1);
            }
            if (s.stories.length > 0 && lead !== "observed") {
              console.error(`::error::firstMover.leadBasis is "${lead}", expected "observed"`);
              process.exit(1);
            }
          '
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}

      # Reaction windows: joins the tape above with the story ledger and
      # measures the sector's move at +1h/+1d/+5d after each first sighting,
      # net of the market. Zero LLM, zero network — it reads the two files this
      # job already wrote and emits `daily_reports/reactions.json`, which the
      # publish step below sends to gh-pages with everything else.
      #
      # Deliberately AFTER the ledger bake (it reads stories.json) and BEFORE
      # the zero-LLM assert (so a bake that ever grew a model call is caught).
      - name: Bake reaction windows
        run: npm run reactions:bake

      # Guard: the reaction file must be self-describing and must never publish
      # a mean off a sample below the floor. An empty tape is a legitimate
      # day-one state (`insufficient` with counts), so this asserts the shape
      # and the honesty rules, not that there is data.
      - name: Assert reaction windows are honest
        run: node scripts/assert-reactions.mjs

      # Guard: theme board heat silently shipped `boards=0` from 2026-11-11 to
      # 2026-11-13 while CI stayed green. Fail the run instead of publishing a
      # themes.json where no theme resolved a board.
      - name: Assert theme boards resolved
        run: |
          node -e '
            const t = require("./daily_reports/themes.json");
            const boards = t.themes.filter((x) => x.boardCode).length;
            const moved = t.themes.filter((x) => typeof x.boardChangePct === "number").length;
            const members = t.themes.filter((x) => (x.constituents ?? []).length > 0).length;
            console.log(`themes=${t.themes.length} boards=${boards} quoted=${moved} withConstituents=${members} status=${t.status} registry=${t.registry}`);
            if (boards < 15) {
              console.error(`::error::only ${boards}/${t.themes.length} themes resolved a board (need >= 15) — board resolution is broken`);
              process.exit(1);
            }
          '

      - name: Bake trend periods
        run: npm run periods:bake

      - name: Bake search index
        run: npm run search:bake

      # Reading pages (increment 7): /hour.html and /stories.html. Must run
      # BEFORE build-site — the homepage copy inherits the nav links from the
      # latest edition's markup, and build-site rewrites their `../` prefixes for
      # the root. Fail-open by construction: the script exits 0 and names a gap
      # when the tape or the ledger is absent, so a missing product can never
      # cost the edition.
      - name: Build reading pages (hour + stories)
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
        run: npm run reading:pages

      # The versioned /v1 namespace + /integrity.html. Reads only files already
      # in the tree (tape/, stories.json, themes.json, reactions.json) and never
      # touches the network, so it costs nothing and cannot fail the edition on
      # an upstream problem: a missing input becomes a named gap and the step
      # still exits 0. Runs AFTER the reading pages so both share one view of the
      # tape, and BEFORE build-site because build-site links to integrity.html
      # only when it exists; all of it must be inside daily_reports/ when the
      # publish step ships that tree.
      - name: Bake v1 namespace and integrity page
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
        run: npm run v1:bake

      # Guard: a v1 file whose shape regressed, or a manifest advertising an
      # endpoint with no file behind it, must not reach gh-pages. The baker
      # checks its own payloads before writing; this re-checks what is on disk,
      # because disk is what gets published.
      - name: Assert v1 contract
        run: npm run assert:v1

      - name: Build static site (index + archive)
        run: npm run build-site

      # ZERO-TOKEN ASSERT (owner directive): machine-checkable proof that this
      # run spent no LLM call — no human or agent has to read the log.
      # `logs/llm-calls.jsonl` absent is the expected zero-call case and
      # passes; ANY entry at/after LLM_LOG_SINCE fails the run BEFORE it can
      # publish. Deliberately after the last generating step (build-site) so a
      # bake that ever grows an LLM call is caught too.
      - name: Assert zero LLM calls
        run: node scripts/assert-zero-llm.mjs --since "$LLM_LOG_SINCE"

      - name: Alert if edition HTML missing or empty
        if: always()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || vars.ALERT_WEBHOOK_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
        run: node scripts/notify-failure.mjs --missing-html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'brief: ${{ needs.gate.outputs.edition-date }}/${{ needs.gate.outputs.edition-hour }} for ${{ github.run_id }}'

      # PUBLISH-LAG ASSERT (owner directive): "did it publish on time" is a
      # machine check, not something a human or agent watches.
      #
      # Deliberately AFTER the publish step: a late edition must still go
      # live, then turn the run red. Failing before publish would drop the
      # edition again, the gate would rebuild it even later, and the slot
      # could never recover.
      #
      # Lag = the instant this step runs (immediately after the gh-pages push,
      # so it IS the publish moment) minus the slot time in Asia/Shanghai.
      # > PUBLISH_LAG_LIMIT_MIN (default 20) fails the run and calls
      # scripts/notify-failure.mjs. A backfilled (补发) edition reports its lag
      # and stays green — it is a recovery, not a breach.
      - name: Assert publish lag
        id: publish-lag
        env:
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
          EDITION_TRIGGER: ${{ needs.gate.outputs.reason }}
          # ALREADY_PUBLISHED arrives via $GITHUB_ENV from the step above.
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          PUBLISH_LAG_LIMIT_MIN: ${{ vars.PUBLISH_LAG_LIMIT_MIN || '20' }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || vars.ALERT_WEBHOOK_URL }}
        run: node scripts/assert-publish-lag.mjs

      - name: Push new edition (opt-in)
        if: success()
        env:
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
        run: node scripts/notify-publish.mjs

      - name: Alert on job failure
        # cancelled() too: a timeout/hung build is cancelled, not failure —
        # without this branch the alert step is silently skipped.
        # PUBLISH_LAG_NOTIFIED: the lag assertion already paged with the real
        # lag numbers, so do not page twice for one late edition.
        if: (failure() || cancelled()) && env.PUBLISH_LAG_NOTIFIED != 'true'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || vars.ALERT_WEBHOOK_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          EDITION_DATE: ${{ needs.gate.outputs.edition-date }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
        run: node scripts/notify-failure.mjs --failure --reason "build job failed"


  # POINT-IN-TIME TAPE — half-hourly captures during the two A-share sessions.
  #
  # Deliberately a separate, narrowly-scoped job rather than steps inside
  # `build`:
  #   - `build` runs when an EDITION is due (06/13/19 + catchup) and carries the
  #     gh-pages publish, the publish-lag assert and the edition push;
  #   - the tape runs when a SESSION SLOT is due (10 half-hourly slots) and
  #     publishes only the immutable snapshot files.
  # Folding it into `build` would mean an edition build every half hour, or a
  # tape tick gated on an edition being due — neither is the deliverable. The
  # gate job stays the single decision point: it runs `gate.mjs` twice, once per
  # mode, and these two jobs hang off its two disjoint output sets.
  tape:
    name: Tape capture
    # Depends on `build` as well as `gate`, and runs even when `build` was
    # skipped (the usual case: no edition due), which is why `always()` is
    # required — a skipped dependency otherwise blocks the dependent job.
    #
    # Ordering behind `build` closes a write race: the edition job publishes its
    # whole tree with `keep_files: false`, so a snapshot pushed while a build is
    # running would be deleted by that build's own push. Running after it means
    # the snapshot lands on a finished tree. Across workflow runs the same race
    # is closed by the in-flight guard in `gate.mjs --mode=tape`.
    needs: [gate, build]
    if: always() && needs.gate.outputs.tape-should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # One capture at a time. Unlike the build group this does NOT cancel in
    # progress: a cancelled capture writes no file, and the slot would become a
    # gap for no reason. A queued second tick is cheap and lands as a revision.
    concurrency:
      group: daily-brief-tape
      cancel-in-progress: false
    # Same structural zero-token pin as the build job: the tape is arithmetic
    # over quote feeds and must never be able to reach an LLM backend, whether
    # or not a key happens to exist.
    env:
      LLM_MODE: 'off'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Scope for the zero-token assertion below — same meaning as the build
      # job's: only calls recorded at/after this instant count.
      - name: Record run start
        run: echo "LLM_LOG_SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The append-only store lives in the published tree, so the previous
      # snapshots must be on disk before writing: `wx` would otherwise create a
      # second `rev-N` for a slot that already shipped, or a fresh day directory
      # with no history behind it.
      - name: Restore existing tape from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- tape || true
            # The ledger is restored too because the intraday page below embeds
            # the stories that entered it in the slot's window. Without it that
            # column would render as a gap on every intraday refresh and then
            # reappear on the next edition build.
            git --work-tree=daily_reports checkout origin/gh-pages -- stories.json || true
            echo "Restored $(find daily_reports/tape -name '*.json' 2>/dev/null | wc -l) prior tape file(s)"
          else
            echo "gh-pages doesn't exist yet — first tape capture"
          fi

      - name: Capture snapshot
        env:
          # Zero-token mode is pinned at job level; restated so a future
          # step-level env cannot silently re-enable the LLM path.
          LLM_MODE: 'off'
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          # The slot the gate decided on. The baker re-derives the slot from the
          # schedule when this is empty, and honours it verbatim when set, so
          # the file written is always the one the gate named.
          TAPE_SLOT: ${{ needs.gate.outputs.tape-slot }}
          TAPE_DATE: ${{ needs.gate.outputs.tape-date }}
        run: npm run tape:bake

      # Refresh the intraday page from the tape that now includes this capture.
      # `--only=hour` because this job restores only `tape/` and `stories.json`:
      # rebuilding stories.html here would overwrite the real ledger page with
      # whatever partial state this job happens to hold.
      #
      # Runs BEFORE the zero-token assert on purpose — that assert is scoped to
      # this run and must cover the last generating step, so a new step placed
      # after it would be unguarded.
      - name: Rebuild intraday page
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
        run: npm run reading:pages -- --only=hour

      # ZERO-TOKEN ASSERT — same check, same script, same rule as the build
      # job. The tape reads quote feeds and does arithmetic; a single logged
      # LLM call here means the pin was bypassed and the run must fail before
      # it publishes.
      - name: Assert zero LLM calls
        run: node scripts/assert-zero-llm.mjs --since "$LLM_LOG_SINCE"

      # Fail-open proof, not decoration: publishing an empty capture would hide
      # a broken upstream behind a green run. The snapshot must exist, must
      # parse, and must carry two clocks on every record — the same guard the
      # baker runs before writing, re-run against what is actually on disk.
      - name: Assert snapshot integrity
        env:
          TAPE_DATE: ${{ needs.gate.outputs.tape-date }}
          TAPE_SLOT: ${{ needs.gate.outputs.tape-slot }}
        run: >-
          node scripts/assert-tape-snapshot.mjs
          --date "$TAPE_DATE" --slot "$TAPE_SLOT"

      # Publish ONLY the tape tree and the page just rebuilt from it.
      # `keep_files: true` is what makes this safe: the edition job owns every
      # other path in the published branch, and this job must never delete an
      # edition it did not write. The tape itself is append-only on disk, so a
      # re-push can only add files.
      #
      # `stories.json` is also present in the tree here because the page build
      # above read it. That is deliberately left alone rather than excluded by
      # staging a second directory: it was restored from this same branch and is
      # never written by this job, so the push re-sends identical bytes. A
      # filtered publish_dir would be a second thing to keep correct.
      - name: Publish tape to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: true
          commit_message: 'tape: ${{ needs.gate.outputs.tape-date }}/${{ needs.gate.outputs.tape-slot }} for ${{ github.run_id }}'

      # A tape failure must not page as an edition failure: the alert script
      # reports missing EDITION html, and this job writes none. The tape's own
      # gap surface is `tape/<date>/index.json`, which names an absent slot
      # rather than pretending the run was clean.
      - name: Alert on tape failure
        if: failure() || cancelled()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || vars.ALERT_WEBHOOK_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
        run: node scripts/notify-failure.mjs --failure --reason "tape capture failed (${{ needs.gate.outputs.tape-reason }})"
