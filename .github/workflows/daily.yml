name: Daily Brief

# OpenCool triple brief (06 / 13 / 19 Asia/Shanghai) — LLM_MODE forced off.
#
# One-time setup:
#   1. Settings → Actions → General → Workflow permissions: Read and write
#   2. Settings → Pages → Deploy from branch → gh-pages / root
#   3. Variables (recommended):
#        REPORT_TZ=Asia/Shanghai
#        REPORT_HOUR=6,13,19
#        REPORT_LOCALE=zh
#        LLM_MODE=off   (forced in this workflow regardless)
#   4. Do NOT add DeepSeek / other LLM secrets for this fork's default path.
#   5. Optional: secret/var ALERT_WEBHOOK_URL for missing-edition / failure pings
#      (scripts/notify-failure.mjs no-ops when unset).
#   6. Actions → Daily Brief → Run workflow once to seed.
#
# Live: https://<user>.github.io/<repo>/
# Archive listing norm starts 2026-09-16 (06 + 13 + 19).

on:
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# NOTE: no workflow-level concurrency — a hung build must never queue-block
# the 7s gate runs. The build job carries its own concurrency group below.

jobs:
  gate:
    name: Time gate
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      edition-hour: ${{ steps.check.outputs.edition-hour }}
    steps:
      - name: Check schedule
        id: check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR || '6,13,19' }}
          REPORT_DAYS: ${{ vars.REPORT_DAYS }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TZ_VAL="${REPORT_TZ:-Asia/Shanghai}"
          HOURS_VAL="${REPORT_HOUR:-6,13,19}"
          DAYS_VAL="${REPORT_DAYS:-*}"

          NOW_HOUR=$(TZ="$TZ_VAL" date +%-H)
          NOW_DOW=$(TZ="$TZ_VAL" date +%w)
          TODAY=$(TZ="$TZ_VAL" date +%Y-%m-%d)
          NOW_PRINT=$(TZ="$TZ_VAL" date '+%Y-%m-%d %H:%M %Z')

          echo "Now in $TZ_VAL: $NOW_PRINT (hour=$NOW_HOUR, dow=$NOW_DOW)"
          echo "Configured REPORT_HOUR='$HOURS_VAL', REPORT_DAYS='$DAYS_VAL'"

          IFS=',' read -ra HLIST <<< "$HOURS_VAL"

          pad2() {
            printf '%02d' "$1"
          }

          # Manual: pick latest due slot (or first if before all)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            chosen="${HLIST[0]// /}"
            for h in "${HLIST[@]}"; do
              h_trim="${h// /}"
              if [ "$NOW_HOUR" -ge "$h_trim" ]; then
                chosen="$h_trim"
              fi
            done
            SLOT=$(pad2 "$chosen")
            echo "Manual trigger — edition slot $SLOT"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "edition-hour=$SLOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          day_match=false
          if [ "$DAYS_VAL" = "*" ]; then
            day_match=true
          else
            IFS=',' read -ra DLIST <<< "$DAYS_VAL"
            for d in "${DLIST[@]}"; do
              d_trim="${d// /}"
              if [[ "$d_trim" == *-* ]]; then
                start="${d_trim%-*}"
                end="${d_trim#*-}"
                if [ "$NOW_DOW" -ge "$start" ] && [ "$NOW_DOW" -le "$end" ]; then
                  day_match=true
                  break
                fi
              else
                if [ "$NOW_DOW" = "$d_trim" ]; then
                  day_match=true
                  break
                fi
              fi
            done
          fi

          if [ "$day_match" != "true" ]; then
            echo "✗ Day filter miss"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "edition-hour=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Exact hour match → that slot
          for h in "${HLIST[@]}"; do
            h_trim="${h// /}"
            if [ "$NOW_HOUR" = "$h_trim" ]; then
              SLOT=$(pad2 "$h_trim")
              echo "✓ Exact hour match — slot $SLOT"
              echo "should-run=true" >> "$GITHUB_OUTPUT"
              echo "edition-hour=$SLOT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          # Catchup: earliest due slot still missing on gh-pages.
          # Check the JSON sidecar, NOT the HTML: build-site publishes a
          # friendly placeholder <slot>.html for future slots, so HTML
          # existence can't distinguish a real edition from a placeholder.
          # Real editions always write <slot>.json; placeholders never do.
          for h in "${HLIST[@]}"; do
            h_trim="${h// /}"
            if [ "$NOW_HOUR" -lt "$h_trim" ]; then
              continue
            fi
            SLOT=$(pad2 "$h_trim")
            CHECK_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${TODAY}/${SLOT}.json?ref=gh-pages"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$CHECK_URL" || echo "000")
            # Anything other than a clean 200 (404 missing, 403/429 rate
            # limit, 000 network flake) → rebuild. A redundant build is
            # bounded and harmless; a silently skipped edition is not.
            if [ "$HTTP_CODE" != "200" ]; then
              echo "↻ Catchup: ${TODAY}/${SLOT}.json not confirmed (HTTP $HTTP_CODE) — recovering"
              echo "should-run=true" >> "$GITHUB_OUTPUT"
              echo "edition-hour=$SLOT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Slot $SLOT published (HTTP $HTTP_CODE)"
          done

          echo "✗ No match / nothing to catch up"
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          echo "edition-hour=" >> "$GITHUB_OUTPUT"

  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    # 25min hard stop pairs with the pipeline watchdog (PIPELINE_DEADLINE_MIN,
    # default 20min in scripts/daily.ts): a hung build gets cut loose well
    # before it can starve later editions.
    timeout-minutes: 25
    # Job-level group: overlapping builds queue/cancel here only — gates
    # always run. A newer dispatch cancels a hung older build; the missing
    # slot is then recovered by the next hourly catchup.
    concurrency:
      group: daily-brief-build
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            rm -f daily_reports/index.html daily_reports/archive.html
            echo "Restored $(ls -1d daily_reports/20*/ 2>/dev/null | wc -l) prior report dirs"
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      - name: Generate edition report
        env:
          # OpenCool: always off — no DeepSeek / paid LLM this round
          LLM_MODE: 'off'
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR || '6,13,19' }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
          DISABLE_SOURCE_IDS: ${{ vars.DISABLE_SOURCE_IDS || 'linuxdo' }}
          DAILYHOT_API_BASE: ${{ vars.DAILYHOT_API_BASE }}
          WEB_MODE: 'true'
        run: npm run daily

      - name: Build trails page (favorites)
        run: npm run build-trails

      - name: Build static site (index + archive)
        run: npm run build-site

      - name: Alert if edition HTML missing or empty
        if: always()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || vars.ALERT_WEBHOOK_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
        run: node scripts/notify-failure.mjs --missing-html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'brief: ${{ needs.gate.outputs.edition-hour }} for ${{ github.run_id }}'

      - name: Alert on job failure
        # cancelled() too: a timeout/hung build is cancelled, not failure —
        # without this branch the alert step is silently skipped.
        if: failure() || cancelled()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL || vars.ALERT_WEBHOOK_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
          EDITION_HOUR: ${{ needs.gate.outputs.edition-hour }}
        run: node scripts/notify-failure.mjs --failure --reason "build job failed"
