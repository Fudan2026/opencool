services:
  daily:
    build: .
    environment:
      LLM_MODE: off
      REPORT_TZ: Asia/Shanghai
      REPORT_HOUR: 6,13,19
      REPORT_LOCALE: zh
      LOOP_MINUTES: 30
      # DAILY_ONCE: "1"   # one evaluation then exit (smoke test)
      # DAILY_FORCE: "1"  # regenerate even if the slot already exists
    volumes:
      - ./daily_reports:/app/daily_reports
      - ./logs:/app/logs
    restart: unless-stopped
